databases:
  - name: adib-portfolio-db
    plan: free
    databaseName: portfolio

services:
  - type: web
    name: adib-portfolio-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      (python manage.py createsuperuser --noinput || true)
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adib-portfolio-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: NUM_PROXIES
        value: "1"
      # Beim ersten Deploy im Render-Dashboard eintragen (nicht ins Repo!):
      - key: CORS_ALLOWED_ORIGINS      # z.B. https://dein-projekt.vercel.app
        sync: false
      - key: CSRF_TRUSTED_ORIGINS      # gleicher Wert wie CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD       # Gmail APP-Passwort (16 Zeichen)
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
