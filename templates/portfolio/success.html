<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erfolg - Adib Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
        }

        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="text-center">
            <div class="text-6xl mb-4">🎉</div>
            <h1 class="text-4xl font-bold mb-4 gradient-text">Danke, {{ name }}!</h1>
            <p class="text-xl text-gray-300 mb-8">
                Deine Nachricht wurde erfolgreich versendet. Ich melde mich innerhalb von 24 Stunden bei dir.
            </p>
            <a href="/" class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-lg transition">
                Zurück zur Startseite
            </a>
        </div>
    </div>
</body>
</html>
