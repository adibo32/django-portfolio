[pytest]
# Django Settings Module
DJANGO_SETTINGS_MODULE = config.settings

# Test Discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test Paths
testpaths = tests backend/tests

# Markers
markers =
    django_db: marks tests as requiring database access
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    cors: marks tests as CORS-related
    csrf: marks tests as CSRF-related
    email: marks tests as email-related
    security: marks tests as security-related

# Output & Formatting
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
    --verbose
    -v
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json
    --cov-branch

# Coverage Settings
[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    conftest.py
    manage.py
    */__pycache__/*
    venv/*
    .venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract

[coverage:html]
directory = htmlcov
