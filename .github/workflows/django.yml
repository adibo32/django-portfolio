name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set test environment variables
      run: |
        echo "SECRET_KEY=test_secret_key_12345" >> .env
        echo "DEBUG=False" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1,testserver" >> .env
        echo "EMAIL_HOST_USER=test@example.com" >> .env
        echo "EMAIL_HOST_PASSWORD=test_password" >> .env
        echo "ADMIN_EMAIL=admin@example.com" >> .env
        echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend" >> .env
    
    - name: Run migrations
      run: |
        python manage.py migrate
    
    - name: Run Tests
      run: |
        python manage.py test
